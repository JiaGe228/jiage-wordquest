<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#58cc02" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="K·迦哥闯天下" />
    <title>K迦哥闯天下</title>
    <!-- 独立清单：与主应用注册表隔离，并强制使用真实图标文件（迦 + 右上角 K） -->
    <link rel="manifest" href="./start-manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v12.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-v12.png" />
    <link rel="icon" type="image/png" href="./icon-192-v12.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #58cc02; font-family: -apple-system, "PingFang SC", sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
      img.logo { width: min(58vmin, 360px); border-radius: 26%; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
      .hint { color: #fff; font-size: 17px; font-weight: 700; background: rgba(0,0,0,.18); padding: 10px 18px; border-radius: 999px; }
      button.enter {
        border: none; cursor: pointer; background: #fff; color: #58cc02;
        font-size: 22px; font-weight: 900; padding: 16px 48px; border-radius: 999px;
        box-shadow: 0 6px 0 rgba(0,0,0,.15);
      }
      button.enter:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.15); }
    </style>
  </head>
  <body>
    <img class="logo" src="./icon-512-v12.png" alt="K迦哥闯天下" />
    <div class="hint">点下方「分享 → 添加到主屏幕」，桌面图标就长这样</div>
    <button class="enter" onclick="location.replace('/#/')">进入游戏 →</button>
    <script>
      // 从主屏幕（网页 App 模式）打开时，自动进入游戏；
      // 在 Safari 里打开时保持本页不动，方便添加主屏幕
      var standalone = window.navigator.standalone ||
        (window.matchMedia && matchMedia('(display-mode: standalone)').matches)
      if (standalone) location.replace('/#/')
    </script>
  </body>
</html>
